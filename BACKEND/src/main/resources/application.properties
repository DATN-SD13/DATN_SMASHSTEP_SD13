spring.application.name=smashstep-backend
spring.config.import=optional:classpath:application-local.properties
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=SmashStep;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.port=8080

# CORS: comma-separated frontend origins.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.servlet.multipart.resolve-lazily=true
smashstep.product-images.directory=${SMASHSTEP_PRODUCT_UPLOAD_DIR:uploads/products}
